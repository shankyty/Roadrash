<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Road Rash">
<link rel="manifest" href="manifest.webmanifest">
<title>Road Rash: Rickshaw Rumble</title>
<meta name="description" content="Road Rash with an auto-rickshaw! Race through Mumbai, Hyderabad, Delhi and Chennai, swing your lathi at rival autos and dodge the cows.">
<meta property="og:type" content="website">
<meta property="og:title" content="Road Rash: Rickshaw Rumble 🛺">
<meta property="og:description" content="Road Rash with an auto-rickshaw! Race through Mumbai, Hyderabad, Delhi and Chennai, swing your lathi at rival autos and dodge the cows. Play free in your browser.">
<meta property="og:url" content="https://shankyty.github.io/Roadrash/">
<meta property="og:image" content="https://shankyty.github.io/Roadrash/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#120b1c">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
  :root { --bg: #120b1c; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #wrap { position: relative; }
  canvas { display: block; image-rendering: auto; box-shadow: 0 0 60px rgba(255, 150, 60, .25); border-radius: 6px; }
  #touch { position: absolute; inset: 0; display: none; pointer-events: none; }
  #touch.on { display: block; }
  .tbtn {
    position: absolute; pointer-events: auto; width: 64px; height: 64px; border-radius: 50%;
    background: rgba(0, 0, 0, .35); border: 2px solid rgba(255, 255, 255, .5); color: #fff;
    font: 700 13px system-ui; display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .tbtn.down { background: rgba(255, 200, 0, .5); }
  .tbtn.small { width: 44px; height: 44px; font-size: 16px; }
  #touch .hint { display: none; }
  /* landscape phones: pin the buttons to the screen edges (into the side strips where there's room),
     inside the notch-safe area, so they don't cover the game's HUD */
  @media (orientation: landscape) and (pointer: coarse) {
    #touch.on { position: fixed; inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .tbtn { width: 60px; height: 60px; background: rgba(0, 0, 0, .28); }
  }
  /* portrait phones (e.g. rotation lock on): picture on top, big controls underneath */
  @media (orientation: portrait) and (pointer: coarse) {
    body { align-items: flex-start; }
    #wrap { width: 100vw; }
    canvas { margin: 0 auto; border-radius: 0; }
    #touch.on { position: relative; inset: auto; height: 220px; }
    #touch .hint { display: block; position: absolute; left: 14px; right: 120px; top: 22px; text-align: left; color: rgba(255, 255, 255, .55); font: 12px system-ui; }
    .tbtn { width: 72px; height: 72px; }
    .tbtn.small { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="touch">
    <div class="tbtn" data-key="T_left"  style="left:12px;bottom:84px">◀</div>
    <div class="tbtn" data-key="T_right" style="left:88px;bottom:84px">▶</div>
    <div class="tbtn" data-key="T_hitL"       style="left:12px;bottom:10px">HIT ◀</div>
    <div class="tbtn" data-key="T_hitR"       style="left:88px;bottom:10px">HIT ▶</div>
    <div class="tbtn" data-key="T_up"    style="right:12px;bottom:84px">GAS</div>
    <div class="tbtn" data-key="T_down"  style="right:88px;bottom:84px">BRAKE</div>
    <div class="tbtn" data-key="T_horn"       style="right:12px;bottom:10px">HORN</div>
    <div class="tbtn" data-key="Enter"      style="right:88px;bottom:10px">OK</div>
    <div class="tbtn small" data-key="Escape" style="right:12px;top:12px" title="Pause">❚❚</div>
    <div class="tbtn small" data-key="KeyV" style="right:64px;top:12px" title="Sound">🔊</div>
    <div class="hint">↻ turn your phone sideways for a bigger view</div>
  </div>
</div>
<script src="sounds.js"></script>
<script src="game.js"></script>
</body>
</html>
